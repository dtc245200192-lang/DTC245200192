version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Hardening: Cách ly mạng database không ra internet

volumes:
  db_data:
  wordpress_data:
  grafana_data:

services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Strong_Root_Password_123! # Hardening: Mật khẩu mạnh
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: Strong_WP_Password_123! # Hardening: Mật khẩu mạnh
    networks:
      - backend-net
    volumes:
      - db_data:/var/lib/mysql

  # 2. WordPress
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: Strong_WP_Password_123!
      WORDPRESS_DB_NAME: wordpress
    networks:
      - backend-net
      - frontend-net
    volumes:
      - wordpress_data:/var/www/html

  # 3. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wordpress_pma
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: Strong_Root_Password_123!
    ports:
      - "8080:80"
    networks:
      - backend-net
      - frontend-net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - wordpress

  # 5. Monitoring: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - frontend-net

  # 6. Monitoring: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend-net
    volumes:
      - grafana_data:/var/lib/grafana

# 7. Logging: Loki
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    user: "root"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - frontend-net

# 8. Logging: Promtail
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    user: "root"
    restart: always
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - frontend-net